# Surface Duo 2: release the display pipe the ABL splash keeps reserved
# before the first compositor starts. Until a mode set frees it, SDE refuses
# a commit that lands on that pipe. This is the Duo 2's counterpart to the
# FP6's Plymouth DRM release, and a workaround until the splash handoff is
# fixed in the kernel.
[Service]
ExecStartPre=-/usr/bin/timeout 10 /usr/local/bin/duo2-kmstest 1
